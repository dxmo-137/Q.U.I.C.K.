<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q.U.I.C.K. - คิวหลุด เราเติม คิวเต็ม เราจัดการ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel compiler for inline JSX compilation in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            orange: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              800: '#9a3412',
              900: '#7c2d12',
            }
          }
        }
      }
    }
  </script>
  
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e4e4e7; border-radius: 10px; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: in 0.3s ease-out forwards; }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Custom Inline SVG Icons to replace lucide-react dependencies elegantly
    const Users = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    );
    const Clock = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    );
    const Zap = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    );
    const CheckCircle = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    );
    const XCircle = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    );
    const Store = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M9 16v6"/><path d="M15 16v6"/><path d="M2 7h20"/><path d="M22 12H2"/></svg>
    );
    const Smartphone = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
    );
    const ArrowRight = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    );
    const X = ({ className, onClick }) => (
      <svg className={className} onClick={onClick} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    );
    const ChefHat = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 18c0-3.8 2-6 5-6s5 2.2 5 6H6Z"/><path d="M18 18c0-3.8-2-6-5-6s-5 2.2-5 6h10Z"/><path d="M12 12c2-4 4-4 4-6a4 4 0 1 0-8 0c0 2 2 2 4 6Z"/><rect x="5" y="18" width="14" height="4" rx="1"/></svg>
    );
    const BellRing = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    );
    const TrendingUp = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
    );
    const PlaySquare = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
    );
    const SkipForward = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    );
    const AlertOctagon = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    );
    const Power = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
    );
    const MessageSquare = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    );
    const ArrowLeftRight = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
    );
    const Send = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    );
    const User = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    );
    const Info = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    );
    const PlusCircle = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    );
    const Calendar = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    );

    function App() {
      const [activeView, setActiveView] = useState('customer');
      const [showSwapMarket, setShowSwapMarket] = useState(false);
      const [isCreatingPost, setIsCreatingPost] = useState(false);
      const [activeChat, setActiveChat] = useState(null);
      
      // App States
      const [currentQueue, setCurrentQueue] = useState(112);
      const [myQueue, setMyQueue] = useState(118);
      const [myCurrentTime, setMyCurrentTime] = useState("18:15"); // Mock current time for user
      const [waitingList, setWaitingList] = useState(15);
      const [storeStatus, setStoreStatus] = useState('full');
      const [savedOpportunities, setSavedOpportunities] = useState(24);
      const [isCancelled, setIsCancelled] = useState(false);
      
      // Flash Slot & Swap States
      const [flashSlotActive, setFlashSlotActive] = useState(false);
      const [flashTimeLeft, setFlashTimeLeft] = useState(0);
      
      const [swapRequests, setSwapRequests] = useState([
        { id: 1, user: 'K. Somchai', currentQ: 'A115', currentTime: '18:00', desiredTime: '19:30 - 20:00', note: 'ติดรับลูกครับ', distance: '50m' },
        { id: 2, user: 'K. Jane', currentQ: 'A125', currentTime: '18:45', desiredTime: '17:00 - 17:30', note: 'อยากทานเร็วขึ้นค่ะ', distance: '120m' },
        { id: 3, user: 'K. Mike', currentQ: 'A105', currentTime: '17:30', desiredTime: '19:00 - 20:00', note: 'รอเพื่อนยังไม่ครบ', distance: '300m' },
      ]);

      // New Post Form State
      const [newPostData, setNewPostData] = useState({
        startTime: '19:00',
        endTime: '20:00',
        note: ''
      });

      const [chatMessages, setChatMessages] = useState([
        { sender: 'other', text: 'สวัสดีครับ คุณถือคิว A118 ใช่ไหมครับ พอดีผมอยากสลับไปช่วงนั้นพอดี' }
      ]);
      const [newMsg, setNewMsg] = useState('');

      useEffect(() => {
        let timer;
        if (flashSlotActive && flashTimeLeft > 0) {
          timer = setInterval(() => setFlashTimeLeft((prev) => prev - 1), 1000);
        } else if (flashTimeLeft === 0 && flashSlotActive) {
          setFlashSlotActive(false);
        }
        return () => clearInterval(timer);
      }, [flashSlotActive, flashTimeLeft]);

      const handleCreatePost = (e) => {
        e.preventDefault();
        const newEntry = {
          id: Date.now(),
          user: 'You (Me)',
          currentQ: `A${myQueue}`,
          currentTime: myCurrentTime,
          desiredTime: `${newPostData.startTime} - ${newPostData.endTime}`,
          note: newPostData.note || 'ต้องการแลกช่วงเวลาครับ',
          distance: '0m'
        };
        setSwapRequests([newEntry, ...swapRequests]);
        setIsCreatingPost(false);
        setShowSwapMarket(true);
      };

      const handleCancelQueue = () => {
        setIsCancelled(true);
        setWaitingList((prev) => prev - 1);
        setFlashSlotActive(true);
        setFlashTimeLeft(15);
      };

      const handleClaimFlashSlot = () => {
        setFlashSlotActive(false);
        setIsCancelled(false);
        setMyQueue(currentQueue + 1);
        setSavedOpportunities((prev) => prev + 1);
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!newMsg.trim()) return;
        setChatMessages([...chatMessages, { sender: 'me', text: newMsg }]);
        setNewMsg('');
        setTimeout(() => {
          if (newMsg.includes('ตกลง') || newMsg.includes('แลก')) {
            setChatMessages(prev => [...prev, { sender: 'other', text: 'ยอดเยี่ยมครับ! ผมกด Confirm แลกคิวให้แล้วนะ' }]);
          }
        }, 1000);
      };

      const performSwap = (targetQ) => {
        setMyQueue(parseInt(targetQ.replace('A', '')));
        setActiveChat(null);
        setShowSwapMarket(false);
      };

      const renderCustomerView = () => (
        <div className="max-w-md mx-auto bg-white min-h-[90vh] rounded-[3rem] shadow-2xl overflow-hidden border border-zinc-200 relative flex flex-col mb-10">
          {/* Top Header */}
          <div className="bg-gradient-to-b from-orange-50 to-white p-6 pt-10 text-center border-b border-zinc-100">
            <h1 className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-orange-600 to-amber-600 tracking-tighter">
              Q.U.I.C.K.
            </h1>
            <div className="flex justify-center items-center gap-2 mt-1">
              <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
              <p className="text-zinc-500 text-xs font-medium uppercase tracking-widest">Live Exchange Active</p>
            </div>
          </div>

          <div className="p-6 flex-1 overflow-y-auto custom-scrollbar">
            {/* Flash Slot Notification */}
            {flashSlotActive && (
              <div className="mb-6 bg-gradient-to-r from-orange-50 to-amber-50 rounded-2xl p-0.5 animate-pulse shadow-lg">
                <div className="bg-white rounded-[0.9rem] p-4 border border-orange-200">
                  <div className="flex items-center gap-2 text-orange-600 mb-1">
                    <Zap className="w-4 h-4 text-orange-500" />
                    <span className="font-bold text-xs uppercase">FLASH SLOT FOUND!</span>
                  </div>
                  <p className="text-zinc-600 text-xs mb-3 font-medium">โต๊ะหลุดกะทันหัน! รับสิทธิ์เป็นคิวถัดไปทันที ({flashTimeLeft}s)</p>
                  <button onClick={handleClaimFlashSlot} className="w-full bg-orange-600 text-white font-bold py-2.5 rounded-lg text-sm hover:bg-orange-700 transition-colors shadow-md shadow-orange-600/25 active:scale-95">
                    Claim Now
                  </button>
                </div>
              </div>
            )}

            {/* Current Queue Status */}
            {!isCancelled && !showSwapMarket && (
              <div className="bg-zinc-50 border border-zinc-200 rounded-3xl p-6 mb-6 relative shadow-sm">
                <div className="flex justify-between items-start mb-8">
                  <div>
                    <p className="text-zinc-400 text-xs font-bold uppercase">Your Position</p>
                    <div className="flex items-baseline gap-2">
                      <p className="text-5xl font-black text-zinc-950 mt-1">A{myQueue}</p>
                      <p className="text-orange-600 text-sm font-bold">~{myCurrentTime}</p>
                    </div>
                  </div>
                  <div className="bg-orange-50 text-orange-600 px-3 py-1 rounded-full text-[10px] font-black border border-orange-200">
                    {waitingList} QUEUES LEFT
                  </div>
                </div>
                
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-white p-3 rounded-2xl border border-zinc-200/80 shadow-sm">
                    <p className="text-zinc-400 text-[10px] uppercase font-bold">Current</p>
                    <p className="text-lg font-bold text-zinc-800">A{currentQueue}</p>
                  </div>
                  <div className="bg-white p-3 rounded-2xl border border-zinc-200/80 shadow-sm">
                    <p className="text-zinc-400 text-[10px] uppercase font-bold">Est. Wait</p>
                    <p className="text-lg font-bold text-amber-600 flex items-center gap-1">
                      <Clock className="w-4 h-4 text-amber-500" /> 25m
                    </p>
                  </div>
                </div>

                <button 
                  onClick={() => setIsCreatingPost(true)}
                  className="w-full mt-4 bg-orange-50 hover:bg-orange-100 text-orange-600 border border-orange-200 py-3 rounded-2xl text-xs font-black uppercase flex items-center justify-center gap-2 transition-all"
                >
                  <PlusCircle className="w-4 h-4" /> Create Swap Request
                </button>
              </div>
            )}

            {/* P2P Swap Marketplace */}
            {!isCancelled && (
              <div className="space-y-4">
                <div className="flex justify-between items-center px-1">
                  <h3 className="text-sm font-bold text-zinc-800 flex items-center gap-2">
                    <ArrowLeftRight className="w-4 h-4 text-orange-600" />
                    {showSwapMarket ? 'Marketplace' : 'Recent Swaps'}
                  </h3>
                  <button 
                    onClick={() => setShowSwapMarket(!showSwapMarket)}
                    className="text-orange-600 text-xs font-bold hover:underline"
                  >
                    {showSwapMarket ? 'Close Market' : 'View All Market'}
                  </button>
                </div>

                <div className="space-y-3 animate-in fade-in slide-in-from-bottom-4">
                  {(showSwapMarket ? swapRequests : swapRequests.slice(0, 1)).map((req) => (
                    <div key={req.id} className="bg-zinc-50 border border-zinc-200 p-4 rounded-2xl hover:border-orange-500/50 transition-colors shadow-sm">
                      <div className="flex justify-between items-start mb-3">
                        <div className="flex items-center gap-2">
                          <div className="w-8 h-8 bg-white rounded-full flex items-center justify-center border border-zinc-200 shadow-sm">
                            <User className="w-4 h-4 text-zinc-505" />
                          </div>
                          <div>
                            <p className="text-xs font-bold text-zinc-800">{req.user}</p>
                            <p className="text-[10px] text-zinc-400 font-medium">{req.distance} away</p>
                          </div>
                        </div>
                        <div className="text-right">
                          <p className="text-xs font-black text-orange-600 bg-orange-50 px-2 py-0.5 rounded border border-orange-100">{req.currentQ}</p>
                        </div>
                      </div>

                      <div className="bg-white rounded-xl p-3 mb-3 border border-zinc-200 shadow-inner">
                        <div className="flex items-center justify-between gap-2">
                          <div className="flex-1">
                            <p className="text-[9px] text-zinc-400 uppercase font-bold">Current Time</p>
                            <p className="text-xs font-bold text-zinc-700">{req.currentTime}</p>
                          </div>
                          <ArrowRight className="w-4 h-4 text-orange-500" />
                          <div className="flex-1 text-right">
                            <p className="text-[9px] text-zinc-400 uppercase font-bold">Wants Time</p>
                            <p className="text-xs font-bold text-amber-600">{req.desiredTime}</p>
                          </div>
                        </div>
                      </div>

                      <p className="text-[11px] text-zinc-505 italic mb-3">"{req.note}"</p>
                      <button 
                        onClick={() => setActiveChat(req)}
                        className="w-full bg-white hover:bg-zinc-100 text-zinc-700 text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-2 transition-colors border border-zinc-200 shadow-sm"
                      >
                        <MessageSquare className="w-3 h-3 text-zinc-500" /> Chat & Swap
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {isCancelled && !flashSlotActive && (
              <div className="bg-zinc-50 border border-zinc-200 border-dashed rounded-3xl p-10 text-center">
                <XCircle className="w-12 h-12 text-zinc-400 mx-auto mb-4" />
                <p className="text-zinc-500 text-sm font-medium">คิวของคุณถูกยกเลิกแล้ว</p>
              </div>
            )}
          </div>

          {/* Action Footer */}
          <div className="p-6 bg-white border-t border-zinc-100 grid grid-cols-2 gap-3">
            <button className="bg-zinc-50 hover:bg-zinc-100 text-zinc-700 font-bold py-3 rounded-2xl text-xs flex items-center justify-center gap-2 border border-zinc-200">
              <ChefHat className="w-4 h-4 text-zinc-500" /> Pre-order
            </button>
            <button 
              onClick={handleCancelQueue}
              disabled={isCancelled}
              className={`font-bold py-3 rounded-2xl text-xs flex items-center justify-center gap-2 border transition-all
                ${isCancelled ? 'bg-zinc-100 text-zinc-300 border-zinc-200 cursor-not-allowed' : 'bg-red-50 hover:bg-red-100 text-red-600 border-red-200'}`}
            >
              <Power className="w-4 h-4" /> Cancel Queue
            </button>
          </div>

          {isCreatingPost && (
            <div className="absolute inset-0 bg-white/98 z-[60] flex flex-col p-6 animate-in fade-in duration-200">
              <div className="flex justify-between items-center mb-8 pt-4">
                <h2 className="text-xl font-black text-zinc-900">Post Swap Request</h2>
                <button onClick={() => setIsCreatingPost(false)} className="text-zinc-500 hover:text-zinc-900">
                  <X className="w-6 h-6" />
                </button>
              </div>

              <div className="flex-1 space-y-6">
                <div className="bg-zinc-50 p-4 rounded-2xl border border-zinc-200">
                  <p className="text-[10px] text-zinc-400 font-black uppercase mb-3">Your Current Slot</p>
                  <div className="flex items-center gap-3">
                    <div className="bg-orange-600 text-white px-3 py-1 rounded-lg font-black text-sm shadow-sm">A{myQueue}</div>
                    <div className="text-zinc-800 font-bold">{myCurrentTime}</div>
                  </div>
                </div>

                <div className="space-y-4">
                  <p className="text-[10px] text-zinc-400 font-black uppercase flex items-center gap-2">
                    <Calendar className="w-3 h-3 text-orange-500" /> Preferred Time Range
                  </p>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="text-[9px] text-zinc-400 mb-1 block font-bold">Earliest</label>
                      <input 
                        type="time" 
                        value={newPostData.startTime}
                        onChange={(e) => setNewPostData({...newPostData, startTime: e.target.value})}
                        className="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-4 py-3 text-zinc-800 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-[9px] text-zinc-400 mb-1 block font-bold">Latest</label>
                      <input 
                        type="time" 
                        value={newPostData.endTime}
                        onChange={(e) => setNewPostData({...newPostData, endTime: e.target.value})}
                        className="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-4 py-3 text-zinc-800 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-[10px] text-zinc-400 font-black uppercase mb-1 block">Note (Optional)</label>
                    <textarea 
                      placeholder="e.g. ติดธุระนิดหน่อยครับ, อยากกินเร็วขึ้น..."
                      value={newPostData.note}
                      onChange={(e) => setNewPostData({...newPostData, note: e.target.value})}
                      className="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-4 py-3 text-zinc-800 h-24 focus:border-orange-500 focus:outline-none text-sm resize-none"
                    />
                  </div>
                </div>
              </div>

              <button 
                onClick={handleCreatePost}
                className="w-full bg-orange-600 text-white font-black py-4 rounded-2xl text-sm uppercase tracking-widest hover:bg-orange-700 transition-all shadow-lg shadow-orange-600/25"
              >
                Publish Post
              </button>
            </div>
          )}

          {/* Chat Component */}
          {activeChat && (
            <div className="absolute inset-0 bg-white/95 backdrop-blur-md flex flex-col z-50 animate-in fade-in duration-200">
              <div className="p-6 border-b border-zinc-200 flex justify-between items-center bg-white">
                <div className="flex items-center gap-3">
                  <button onClick={() => setActiveChat(null)} className="text-zinc-505 hover:text-zinc-950"><X className="w-5 h-5" /></button>
                  <div>
                    <p className="text-sm font-bold text-zinc-900">{activeChat.user}</p>
                    <p className="text-[10px] text-green-600 font-bold uppercase tracking-widest">Offers Q: {activeChat.currentQ} ({activeChat.currentTime})</p>
                  </div>
                </div>
                <div className="bg-orange-100 text-orange-600 px-2 py-1 rounded text-[10px] font-bold border border-orange-200">LIVE</div>
              </div>
              
              <div className="flex-1 overflow-y-auto p-6 space-y-4 bg-zinc-50/50">
                <div className="bg-white p-3 rounded-xl border border-zinc-200 mb-2 flex items-start gap-2 shadow-sm">
                  <Info className="w-4 h-4 text-orange-500 flex-shrink-0 mt-0.5" />
                  <p className="text-[10px] text-zinc-500 leading-normal">ระบบจะทำการสลับคิว A{myQueue} ({myCurrentTime}) ของคุณ กับคิว {activeChat.currentQ} ({activeChat.currentTime}) ของคู่สนทนา</p>
                </div>
                {chatMessages.map((msg, i) => (
                  <div key={i} className={`flex ${msg.sender === 'me' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[80%] p-3 rounded-2xl text-xs ${
                      msg.sender === 'me' ? 'bg-orange-600 text-white font-medium shadow-sm' : 'bg-white text-zinc-800 border border-zinc-200 shadow-sm'
                    }`}>
                      {msg.text}
                    </div>
                  </div>
                ))}
              </div>

              <div className="p-4 bg-white border-t border-zinc-200">
                <form onSubmit={handleSendMessage} className="flex gap-2 mb-3">
                  <input 
                    type="text" 
                    value={newMsg}
                    onChange={(e) => setNewMsg(e.target.value)}
                    placeholder="พิมพ์ข้อความ..."
                    className="flex-1 bg-zinc-50 border border-zinc-200 rounded-xl px-4 py-2.5 text-xs text-zinc-800 focus:outline-none focus:border-orange-500"
                  />
                  <button type="submit" className="bg-orange-600 p-2.5 rounded-xl text-white hover:bg-orange-700 shadow-sm">
                    <Send className="w-4 h-4" />
                  </button>
                </form>
                <button 
                  onClick={() => performSwap(activeChat.currentQ)}
                  className="w-full bg-zinc-900 text-white font-black py-3 rounded-xl text-xs uppercase tracking-widest flex items-center justify-center gap-2 hover:bg-zinc-800 shadow-md active:scale-95 transition-all"
                >
                  <ArrowLeftRight className="w-4 h-4" /> Confirm Swap My Queue
                </button>
              </div>
            </div>
          )}
        </div>
      );

      const renderMerchantView = () => (
        <div className="bg-white min-h-[85vh] rounded-[2rem] shadow-2xl border border-zinc-200 overflow-hidden flex flex-col md:flex-row mb-10">
          {/* Merchant Sidebar */}
          <div className="w-full md:w-64 bg-zinc-50/50 border-b md:border-b-0 md:border-r border-zinc-200 p-8 flex flex-col">
            <div className="mb-10">
              <h2 className="text-2xl font-black text-zinc-900 tracking-tighter">Q.U.I.C.K.<span className="text-orange-600 text-[10px] align-top ml-1 border border-orange-500 px-1 rounded bg-orange-50">PRO</span></h2>
              <p className="text-zinc-400 text-[10px] font-bold uppercase tracking-widest mt-1">Partner Dashboard</p>
            </div>

            <div className="space-y-6">
              <div>
                <label className="text-[10px] text-zinc-400 font-black uppercase mb-3 block">Status Control</label>
                <button 
                  onClick={() => setStoreStatus(storeStatus === 'available' ? 'full' : 'available')}
                  className={`w-full py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-2 border transition-all
                    ${storeStatus === 'available' ? 'bg-green-50 text-green-600 border-green-200 hover:bg-green-100' : 'bg-orange-50 text-orange-600 border-orange-200 hover:bg-orange-100'}`}
                >
                  <Store className="w-4 h-4" />
                  {storeStatus === 'available' ? 'Open for Walk-in' : 'Queue Only (Full)'}
                </button>
              </div>

              <div className="bg-white border border-zinc-200 rounded-2xl p-5 shadow-sm">
                <div className="flex justify-between items-start mb-4">
                  <div className="text-orange-600 bg-orange-50 p-2 rounded-lg border border-orange-200">
                    <TrendingUp className="w-4 h-4" />
                  </div>
                  <span className="text-[10px] font-black text-green-600 bg-green-50 border border-green-200 px-2 py-0.5 rounded-full">+12%</span>
                </div>
                <h3 className="text-4xl font-black text-zinc-900">{savedOpportunities}</h3>
                <p className="text-[10px] text-zinc-400 font-bold uppercase mt-1">Opportunity Saved</p>
                <p className="text-[10px] text-orange-600 font-bold mt-3">Est. Rev: ฿{savedOpportunities * 450}</p>
              </div>
            </div>
          </div>

          {/* Merchant Content Area */}
          <div className="flex-1 p-8 bg-zinc-50/30">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-10">
              <div className="bg-white border border-zinc-200 rounded-[2rem] p-8 flex flex-col justify-center items-center text-center shadow-sm">
                <h3 className="text-zinc-400 text-[10px] font-black uppercase mb-2">Now Calling</h3>
                <span className="text-8xl font-black text-zinc-900 tracking-tighter">A{currentQueue}</span>
                <div className="mt-6 px-5 py-2 bg-zinc-50 rounded-full text-zinc-600 text-[10px] font-bold border border-zinc-200 flex items-center gap-2 shadow-inner">
                  <Users className="w-3 h-3 text-orange-600" />
                  {waitingList} PARTIES IN LINE
                </div>
              </div>

              <div className="flex flex-col gap-4">
                <button 
                  onClick={() => {
                    setCurrentQueue(prev => prev + 1);
                    setWaitingList(prev => Math.max(0, prev - 1));
                  }}
                  className="flex-1 bg-orange-600 hover:bg-orange-700 text-white font-black text-lg rounded-3xl flex items-center justify-center gap-3 transition-transform active:scale-95 shadow-lg shadow-orange-600/20"
                >
                  <PlaySquare className="w-6 h-6" /> NEXT GUEST
                </button>
                <div className="grid grid-cols-2 gap-4 h-24">
                  <button className="bg-white hover:bg-zinc-50 text-zinc-700 font-bold rounded-3xl border border-zinc-200 flex flex-col items-center justify-center transition-colors shadow-sm">
                    <SkipForward className="w-5 h-5 mb-1 text-zinc-500" />
                    <span className="text-[10px] uppercase">Skip</span>
                  </button>
                  <button className="bg-white hover:bg-red-50 hover:text-red-600 hover:border-red-200 text-zinc-700 font-bold rounded-3xl border border-zinc-200 flex flex-col items-center justify-center transition-colors group shadow-sm">
                    <AlertOctagon className="w-5 h-5 mb-1 text-zinc-500 group-hover:text-red-500" />
                    <span className="text-[10px] uppercase">No-show</span>
                  </button>
                </div>
              </div>
            </div>

            {/* Live Activity Feed */}
            <div className="bg-white border border-zinc-200 rounded-[2rem] p-6 shadow-sm">
              <h3 className="text-[10px] font-black text-zinc-400 uppercase tracking-widest mb-6 border-b border-zinc-100 pb-4">Real-time Activity</h3>
              <div className="space-y-4">
                {flashSlotActive && (
                  <div className="bg-orange-50 border border-orange-200 rounded-2xl p-4 flex items-center gap-4 animate-pulse">
                    <Zap className="w-5 h-5 text-orange-500 flex-shrink-0" />
                    <div className="text-[11px]">
                      <p className="text-zinc-800"><span className="font-black text-orange-600 uppercase">System:</span> คิว A118 ยกเลิกกะทันหัน</p>
                      <p className="text-orange-600/80 font-medium">Flash Slot เปิดให้คนรอบข้างกดรับแล้ว ({flashTimeLeft}s)</p>
                    </div>
                  </div>
                )}
                <div className="bg-zinc-50 border border-zinc-200 rounded-2xl p-4 flex items-center gap-4 shadow-inner">
                  <ArrowLeftRight className="w-5 h-5 text-blue-500 flex-shrink-0" />
                  <div className="text-[11px]">
                    <p className="text-zinc-800"><span className="font-black text-blue-600 uppercase">Swap Event:</span> K. Somchai สลับคิวกับ K. Jane เรียบร้อย</p>
                    <p className="text-zinc-500">ระบบทำการอัปเดตลำดับคิวในฐานข้อมูลอัตโนมัติ</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-zinc-50 text-zinc-900 p-4 md:p-10 font-sans selection:bg-orange-500 selection:text-white">
          <div className="max-w-6xl mx-auto">
            {/* View Mode Toggle Button */}
            <div className="flex justify-center mb-12">
              <div className="bg-zinc-200/60 p-1.5 rounded-[1.5rem] flex items-center gap-1 border border-zinc-200 shadow-md">
                <button
                  onClick={() => setActiveView('customer')}
                  className={`px-8 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest flex items-center gap-2 transition-all ${
                    activeView === 'customer' 
                      ? 'bg-white text-zinc-950 shadow-md border border-zinc-100' 
                      : 'text-zinc-500 hover:text-zinc-800'
                  }`}
                >
                  <Smartphone className="w-4 h-4" /> Customer App
                </button>
                <button
                  onClick={() => setActiveView('merchant')}
                  className={`px-8 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest flex items-center gap-2 transition-all ${
                    activeView === 'merchant' 
                      ? 'bg-orange-600 text-white shadow-orange-600/10 shadow-md' 
                      : 'text-zinc-500 hover:text-zinc-800'
                  }`}
                >
                  <Store className="w-4 h-4" /> Merchant PRO
                </button>
              </div>
            </div>

            <div className="transition-all duration-500 ease-in-out transform">
              {activeView === 'customer' ? renderCustomerView() : renderMerchantView()}
            </div>
            
            <div className="mt-12 text-center max-w-lg mx-auto">
              <div className="inline-flex items-center gap-2 bg-white border border-zinc-200 px-4 py-2 rounded-full mb-4 shadow-sm">
                 <Zap className="w-3 h-3 text-orange-500" />
                 <span className="text-[10px] text-zinc-500 font-bold">PROTOTYPE MODE ACTIVE</span>
              </div>
              <p className="text-zinc-500 text-[11px] leading-relaxed font-medium">
                ลองใช้ฟีเจอร์ <b>Create Swap Request</b> เพื่อโพสต์เวลาที่ต้องการ 
                และดูใน <b>Marketplace</b> เพื่อดูความต้องการแลกของคนอื่นๆ
              </p>
            </div>
          </div>
        </div>
      );
    }

    // Mount React App in DOM
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
