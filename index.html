<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q.U.I.C.K. - คิวหลุด เราเติม คิวเต็ม เราจัดการ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel compiler for inline JSX compilation in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            orange: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              800: '#9a3412',
              900: '#7c2d12',
            }
          },
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e4e4e7; border-radius: 10px; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-zinc-100 text-zinc-900 min-h-screen flex flex-col items-center py-6 px-4">
  <div id="root" class="w-full max-w-5xl"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Custom Inline SVG Icons
    const Users = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    );
    const Clock = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    );
    const Zap = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    );
    const CheckCircle = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    );
    const XCircle = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    );
    const Store = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M9 16v6"/><path d="M15 16v6"/><path d="M2 7h20"/><path d="M22 12H2"/></svg>
    );
    const ArrowRight = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    );
    const X = ({ className, onClick }) => (
      <svg className={className} onClick={onClick} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    );
    const ChefHat = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 18c0-3.8 2-6 5-6s5 2.2 5 6H6Z"/><path d="M18 18c0-3.8-2-6-5-6s-5 2.2-5 6h10Z"/><path d="M12 12c2-4 4-4 4-6a4 4 0 1 0-8 0c0 2 2 2 4 6Z"/><rect x="5" y="18" width="14" height="4" rx="1"/></svg>
    );
    const MessageSquare = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    );
    const ArrowLeftRight = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
    );
    const Send = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    );
    const User = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    );
    const Info = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    );
    const PlusCircle = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    );
    const Calendar = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    );
    const ShieldCheck = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 11 2 2 4-4"/></svg>
    );
    const TrendingUp = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
    );

    function App() {
      const [activeView, setActiveView] = useState('customer'); // 'customer' or 'merchant'
      const [showSwapMarket, setShowSwapMarket] = useState(false);
      const [isCreatingPost, setIsCreatingPost] = useState(false);
      const [activeChat, setActiveChat] = useState(null);
      
      // Live Shared Queue States
      const [currentQueue, setCurrentQueue] = useState(112);
      const [myQueue, setMyQueue] = useState(118);
      const [myCurrentTime, setMyCurrentTime] = useState("18:15");
      const [waitingList, setWaitingList] = useState(15);
      const [storeStatus, setStoreStatus] = useState('full'); // 'normal' | 'full' | 'busy'
      const [savedOpportunities, setSavedOpportunities] = useState(24);
      const [isCancelled, setIsCancelled] = useState(false);
      
      // Flash Slot & Swap States
      const [flashSlotActive, setFlashSlotActive] = useState(false);
      const [flashTimeLeft, setFlashTimeLeft] = useState(0);
      const [toast, setToast] = useState(null);
      
      // Dynamic Swaps List
      const [swapRequests, setSwapRequests] = useState([
        { id: 1, user: 'K. Somchai', currentQ: 'A115', currentTime: '18:00', desiredTime: '19:30 - 20:00', note: 'ติดรับลูกครับ', distance: '50m' },
        { id: 2, user: 'K. Jane', currentQ: 'A125', currentTime: '18:45', desiredTime: '17:00 - 17:30', note: 'อยากทานเร็วขึ้นค่ะ', distance: '120m' },
        { id: 3, user: 'K. Mike', currentQ: 'A105', currentTime: '17:30', desiredTime: '19:00 - 20:00', note: 'รอเพื่อนยังไม่ครบ', distance: '300m' },
      ]);

      // New Post Form State
      const [newPostData, setNewPostData] = useState({
        startTime: '19:00',
        endTime: '20:00',
        note: ''
      });

      // Chat Simulator State
      const [chatMessages, setChatMessages] = useState([
        { sender: 'other', text: 'สวัสดีครับ คุณถือคิว A118 ใช่ไหมครับ พอดีผมอยากสลับไปช่วงนั้นพอดี' }
      ]);
      const [newMsg, setNewMsg] = useState('');

      // Auto-trigger a simulated Flash Slot after 12 seconds for showcase
      useEffect(() => {
        const initialTimer = setTimeout(() => {
          triggerFlashSlot();
        }, 12000);
        return () => clearTimeout(initialTimer);
      }, []);

      useEffect(() => {
        let timer;
        if (flashSlotActive && flashTimeLeft > 0) {
          timer = setInterval(() => setFlashTimeLeft((prev) => prev - 1), 1000);
        } else if (flashTimeLeft === 0 && flashSlotActive) {
          setFlashSlotActive(false);
        }
        return () => clearInterval(timer);
      }, [flashSlotActive, flashTimeLeft]);

      const triggerFlashSlot = () => {
        setFlashSlotActive(true);
        setFlashTimeLeft(20);
        showNotification("⚡ คิวโต๊ะหลุดกะทันหัน! ดึงเวลาที่ดีที่สุดได้เลยตอนนี้!");
      };

      const showNotification = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 4000);
      };

      const handleCreatePost = (e) => {
        e.preventDefault();
        const newEntry = {
          id: Date.now(),
          user: 'You (Me)',
          currentQ: `A${myQueue}`,
          currentTime: myCurrentTime,
          desiredTime: `${newPostData.startTime} - ${newPostData.endTime}`,
          note: newPostData.note || 'ต้องการแลกช่วงเวลาครับ',
          distance: '0m'
        };
        setSwapRequests([newEntry, ...swapRequests]);
        setIsCreatingPost(false);
        setShowSwapMarket(true);
        showNotification("✅ ส่งคำขอสลับคิวของคุณขึ้นบอร์ดหลักแล้ว!");
      };

      const handleCancelQueue = () => {
        setIsCancelled(true);
        setWaitingList((prev) => Math.max(0, prev - 1));
        triggerFlashSlot();
      };

      const handleClaimFlashSlot = () => {
        setFlashSlotActive(false);
        setIsCancelled(false);
        setMyQueue(currentQueue + 1);
        setMyCurrentTime("18:05");
        setSavedOpportunities((prev) => prev + 1);
        showNotification("🎉 ยินดีด้วย! คุณได้รับสิทธิ์คิวหลุดพิเศษ ด่วนทันใจ!");
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!newMsg.trim()) return;
        setChatMessages([...chatMessages, { sender: 'me', text: newMsg }]);
        const userTyped = newMsg;
        setNewMsg('');

        // Mock Reply Simulator
        setTimeout(() => {
          if (userTyped.includes('ตกลง') || userTyped.includes('แลก') || userTyped.includes('ok') || userTyped.includes('ดี')) {
            setChatMessages(prev => [...prev, { sender: 'other', text: 'ยอดเยี่ยมครับ! ผมกด Confirm แลกคิวให้แล้วนะ ขอบคุณมากครับ! 🙏' }]);
          } else {
            setChatMessages(prev => [...prev, { sender: 'other', text: 'สะดวกไหมครับ พอดีโต๊ะผมจะมาถึงพอดี' }]);
          }
        }, 1500);
      };

      // Two-way Swapping Logic to completely prevent duplicate queues (e.g., A115 having 2 people)
      const performSwap = (targetQ) => {
        const prevUserQ = myQueue;
        const prevUserTime = myCurrentTime;
        const targetQParsed = parseInt(targetQ.replace('A', ''));

        // Find target user request on board
        const targetRequest = swapRequests.find(r => r.currentQ === targetQ);
        if (!targetRequest) return;
        
        // 1. Swap current user's values with the target's
        setMyQueue(targetQParsed);
        setMyCurrentTime(targetRequest.currentTime);
        
        // 2. Transfer the current user's old queue back to the target user request to prevent duplication
        setSwapRequests(prevRequests => 
          prevRequests.map(req => 
            req.currentQ === targetQ 
              ? { 
                  ...req, 
                  currentQ: `A${prevUserQ}`, 
                  currentTime: prevUserTime,
                  user: `${req.user} (สลับแล้ว)`,
                  note: `สลับคิวกับคุณเรียบร้อย`
                } 
              : req
          )
        );
        
        setActiveChat(null);
        setShowSwapMarket(false);
        setSavedOpportunities((prev) => prev + 1);
        showNotification(`🔄 สลับคิวสำเร็จแล้ว! ตอนนี้คุณคือคิว A${targetQParsed} (คิว A${prevUserQ} ถูกโอนให้อีกฝ่ายแล้ว)`);
      };

      const handleCallNextQueue = () => {
        const nextQ = currentQueue + 1;
        setCurrentQueue(nextQ);
        setWaitingList((prev) => Math.max(0, prev - 1));
        showNotification(`📢 เรียกคิวถัดไปสำเร็จ: คิว A${nextQ}`);
        
        // Dynamic notification if client's current queue is up
        if (nextQ === myQueue) {
          showNotification("🔔 ถึงคิวของคุณแล้ว! โปรดติดต่อหน้าร้านเพื่อรับโต๊ะ");
        }
      };

      const handleAddManualQueue = () => {
        setWaitingList((prev) => prev + 1);
        showNotification("📝 เพิ่มคิว Walk-in หน้าร้านเรียบร้อย");
      };

      // Filter out user's own published queue requests from showing in their own swappable marketplace items
      const filteredSwapRequests = swapRequests.filter(req => req.currentQ !== `A${myQueue}`);

      const renderCustomerView = () => (
        <div className="max-w-md mx-auto bg-[#FAF6F0] min-h-[85vh] rounded-3xl shadow-xl overflow-hidden border border-zinc-200/80 relative flex flex-col mb-10 transition-all">
          {/* Top Header */}
          <div className="relative overflow-hidden bg-gradient-to-b from-orange-50 to-[#FAF6F0] p-6 pt-8 pb-5 text-center border-b border-zinc-100">
            <div className="absolute top-5 left-1/2 -translate-x-1/2 text-[4rem] font-black text-orange-500/10 tracking-widest pointer-events-none select-none">
              Q.U.I.C.K.
            </div>
            <h1 className="text-xl font-extrabold text-zinc-900 relative z-10">Post Swap Request</h1>
            <div className="flex justify-center items-center gap-2 mt-2 relative z-10">
              <span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
              <p className="text-zinc-500 text-[10px] font-bold uppercase tracking-widest">Live Exchange Active</p>
            </div>
            
            <button 
              onClick={() => setIsCancelled(false)}
              className="absolute top-8 right-6 p-2 rounded-full hover:bg-zinc-100 text-zinc-400 hover:text-zinc-600 transition-colors"
            >
              <X className="w-5 h-5" />
            </button>
          </div>

          <div className="p-5 flex-1 overflow-y-auto custom-scrollbar">
            {/* Flash Slot Notification */}
            {flashSlotActive && (
              <div className="mb-5 bg-gradient-to-r from-orange-500 via-amber-500 to-orange-500 rounded-2xl p-[2px] animate-pulse shadow-lg">
                <div className="bg-white rounded-[0.9rem] p-4 border border-orange-200">
                  <div className="flex items-center gap-2 text-orange-600 mb-1">
                    <Zap className="w-4 h-4 text-orange-500 animate-bounce" />
                    <span className="font-extrabold text-[11px] uppercase tracking-wider">FLASH SLOT FOUND!</span>
                  </div>
                  <p className="text-zinc-600 text-xs mb-3 font-medium">โต๊ะหลุดกะทันหัน! รับสิทธิ์เลื่อนเป็นคิวถัดไปทันที ({flashTimeLeft}s)</p>
                  <button onClick={handleClaimFlashSlot} className="w-full bg-orange-600 text-white font-extrabold py-2.5 rounded-xl text-xs hover:bg-orange-700 transition-colors shadow-md shadow-orange-600/25 active:scale-95">
                    Claim Quick Slot
                  </button>
                </div>
              </div>
            )}

            {/* Current Queue Status */}
            {!isCancelled && !showSwapMarket && (
              <div className="bg-white border border-zinc-200/60 rounded-3xl p-6 mb-5 relative shadow-sm">
                <div className="flex justify-between items-start mb-6">
                  <div>
                    <p className="text-zinc-400 text-[10px] font-bold uppercase tracking-wide">Your Current Slot</p>
                    <div className="flex items-baseline gap-2">
                      <p className="text-5xl font-black text-zinc-950 mt-1">A{myQueue}</p>
                      <p className="text-orange-600 text-sm font-bold">~{myCurrentTime}</p>
                    </div>
                  </div>
                  <div className="bg-orange-50 text-orange-600 px-3 py-1 rounded-full text-[10px] font-extrabold border border-orange-200">
                    {waitingList} QUEUES LEFT
                  </div>
                </div>

                {/* Grid mirroring screenshot */}
                <div className="grid grid-cols-2 gap-3 mb-4">
                  <div className="bg-zinc-50/80 p-3.5 rounded-2xl border border-zinc-100 shadow-sm">
                    <p className="text-zinc-400 text-[9px] uppercase font-bold tracking-wide">Current Calling</p>
                    <p className="text-xl font-extrabold text-zinc-800">A{currentQueue}</p>
                  </div>
                  <div className="bg-zinc-50/80 p-3.5 rounded-2xl border border-zinc-100 shadow-sm">
                    <p className="text-zinc-400 text-[9px] uppercase font-bold tracking-wide">Est. Wait</p>
                    <p className="text-xl font-extrabold text-amber-600 flex items-center gap-1">
                      <Clock className="w-4 h-4 text-amber-500" /> 25m
                    </p>
                  </div>
                </div>

                <button 
                  onClick={() => setIsCreatingPost(true)}
                  className="w-full bg-orange-50 hover:bg-orange-100/70 text-orange-600 border border-orange-200/80 py-3.5 rounded-2xl text-xs font-black uppercase flex items-center justify-center gap-2 transition-all active:scale-[0.98]"
                >
                  <PlusCircle className="w-3.5 h-3.5" /> Create Swap Request
                </button>
              </div>
            )}

            {/* P2P Swap Marketplace */}
            {!isCancelled && (
              <div className="space-y-4">
                <div className="flex justify-between items-center px-1">
                  <h3 className="text-sm font-black text-zinc-800 flex items-center gap-2">
                    <ArrowLeftRight className="w-4 h-4 text-orange-600" />
                    {showSwapMarket ? 'Marketplace Boards' : 'Recent Swaps'}
                  </h3>
                  <button 
                    onClick={() => setShowSwapMarket(!showSwapMarket)}
                    className="text-orange-600 text-xs font-bold hover:underline"
                  >
                    {showSwapMarket ? 'Close Boards' : 'View All Market'}
                  </button>
                </div>

                <div className="space-y-3 animate-in">
                  {(showSwapMarket ? filteredSwapRequests : filteredSwapRequests.slice(0, 1)).map((req) => (
                    <div key={req.id} className="bg-white border border-zinc-200/60 p-4 rounded-3xl hover:border-orange-500/50 transition-all shadow-sm">
                      <div className="flex justify-between items-start mb-3">
                        <div className="flex items-center gap-2.5">
                          <div className="w-9 h-9 bg-orange-50 rounded-full flex items-center justify-center border border-orange-100">
                            <User className="w-4 h-4 text-orange-600" />
                          </div>
                          <div>
                            <p className="text-xs font-bold text-zinc-800">{req.user}</p>
                            <p className="text-[10px] text-zinc-400 font-bold">{req.distance} away</p>
                          </div>
                        </div>
                        <div>
                          <p className="text-xs font-extrabold text-orange-600 bg-orange-50 px-2.5 py-1 rounded-lg border border-orange-100">{req.currentQ}</p>
                        </div>
                      </div>

                      <div className="bg-zinc-50 rounded-2xl p-3.5 mb-3 border border-zinc-100 shadow-inner">
                        <div className="flex items-center justify-between gap-2">
                          <div className="flex-1">
                            <p className="text-[9px] text-zinc-400 uppercase font-black">Current Time</p>
                            <p className="text-xs font-bold text-zinc-700">{req.currentTime}</p>
                          </div>
                          <ArrowRight className="w-4 h-4 text-orange-500" />
                          <div className="flex-1 text-right">
                            <p className="text-[9px] text-zinc-400 uppercase font-black">Wants Time</p>
                            <p className="text-xs font-bold text-amber-600">{req.desiredTime}</p>
                          </div>
                        </div>
                      </div>

                      {req.note && <p className="text-[11px] text-zinc-500 italic mb-3">"{req.note}"</p>}
                      
                      <button 
                        onClick={() => {
                          setChatMessages([{ sender: 'other', text: `สวัสดีครับ ผมถือคิว ${req.currentQ} (${req.currentTime}) สะดวกสลับไหมครับ?` }]);
                          setActiveChat(req);
                        }}
                        className="w-full bg-white hover:bg-zinc-50 text-zinc-700 text-xs font-black py-2.5 rounded-xl flex items-center justify-center gap-2 transition-colors border border-zinc-200"
                      >
                        <MessageSquare className="w-3.5 h-3.5 text-zinc-500" /> Chat & Swap
                      </button>
                    </div>
                  ))}
                  {filteredSwapRequests.length === 0 && (
                    <p className="text-center text-xs text-zinc-400 py-6">ไม่มีรายการสลับคิวที่สามารถจับคู่กับคุณได้ในขณะนี้</p>
                  )}
                </div>
              </div>
            )}

            {isCancelled && !flashSlotActive && (
              <div className="bg-white border border-zinc-200 border-dashed rounded-3xl p-10 text-center shadow-inner my-10">
                <XCircle className="w-12 h-12 text-zinc-400 mx-auto mb-4" />
                <p className="text-zinc-500 text-sm font-extrabold">คิวของคุณถูกยกเลิกแล้ว</p>
                <button 
                  onClick={() => {
                    setIsCancelled(false);
                    setMyQueue(118);
                    setMyCurrentTime("18:15");
                    setWaitingList(15);
                  }}
                  className="mt-4 text-xs font-bold text-orange-600 hover:underline"
                >
                  จองคิวใหม่อีกครั้ง
                </button>
              </div>
            )}
          </div>

          {/* Action Footer */}
          <div className="p-5 bg-white border-t border-zinc-100 grid grid-cols-2 gap-3 relative z-10 pb-8">
            <button className="bg-zinc-50 hover:bg-zinc-100 text-zinc-700 font-extrabold py-3.5 rounded-2xl text-xs flex items-center justify-center gap-2 border border-zinc-200 transition-colors">
              <ChefHat className="w-4 h-4 text-zinc-500" /> Pre-order Food
            </button>
            <button 
              onClick={handleCancelQueue}
              disabled={isCancelled}
              className={`font-bold py-3.5 rounded-2xl text-xs flex items-center justify-center gap-2 border transition-all
                ${isCancelled ? 'bg-zinc-100 text-zinc-300 border-zinc-200 cursor-not-allowed' : 'bg-red-50 hover:bg-red-100 text-red-600 border-red-200'}`}
            >
              Cancel Queue
            </button>
          </div>

          {/* Create Post Sheet Modal Overlay */}
          {isCreatingPost && (
            <div className="absolute inset-0 bg-[#FAF6F0] z-50 flex flex-col p-6 animate-in rounded-3xl">
              <div className="flex justify-between items-center mb-6 pt-2">
                <h2 className="text-xl font-black text-zinc-900">Post Swap Request</h2>
                <button onClick={() => setIsCreatingPost(false)} className="text-zinc-400 hover:text-zinc-700 p-1">
                  <X className="w-6 h-6" />
                </button>
              </div>

              <div className="flex-1 space-y-6">
                <div className="bg-white p-4.5 rounded-2xl border border-zinc-100 shadow-sm">
                  <p className="text-[10px] text-zinc-400 font-black uppercase mb-3 tracking-wider">Your Current Slot</p>
                  <div className="flex items-center gap-3">
                    <div className="bg-orange-600 text-white px-3.5 py-1 rounded-xl font-black text-sm">A{myQueue}</div>
                    <div className="text-zinc-800 font-extrabold">{myCurrentTime}</div>
                  </div>
                </div>

                <div className="space-y-4">
                  <p className="text-[10px] text-zinc-400 font-black uppercase flex items-center gap-2 tracking-wider">
                    <Calendar className="w-3.5 h-3.5 text-orange-500" /> Preferred Time Range
                  </p>
                  
                  {/* Screenshot Input Simulation */}
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="text-[9px] text-zinc-400 mb-1 block font-bold uppercase tracking-wider">Earliest</label>
                      <input 
                        type="time" 
                        value={newPostData.startTime}
                        onChange={(e) => setNewPostData({...newPostData, startTime: e.target.value})}
                        className="w-full bg-white border border-zinc-200 rounded-2xl px-4 py-3 text-zinc-800 font-bold focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 focus:outline-none shadow-sm"
                      />
                    </div>
                    <div>
                      <label className="text-[9px] text-zinc-400 mb-1 block font-bold uppercase tracking-wider">Latest</label>
                      <input 
                        type="time" 
                        value={newPostData.endTime}
                        onChange={(e) => setNewPostData({...newPostData, endTime: e.target.value})}
                        className="w-full bg-white border border-zinc-200 rounded-2xl px-4 py-3 text-zinc-800 font-bold focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 focus:outline-none shadow-sm"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-[10px] text-zinc-400 font-black uppercase mb-1.5 block tracking-wider">Note (Optional)</label>
                    <textarea 
                      placeholder="e.g. ติดธุระนิดหน่อยครับ, อยากกินเร็วขึ้น..."
                      value={newPostData.note}
                      onChange={(e) => setNewPostData({...newPostData, note: e.target.value})}
                      className="w-full bg-white border border-zinc-200 rounded-2xl px-4 py-3.5 text-zinc-800 h-24 focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-500/20 text-xs resize-none shadow-sm font-medium"
                    />
                  </div>
                </div>
              </div>

              <button 
                onClick={handleCreatePost}
                className="w-full bg-orange-600 text-white font-black py-4 rounded-2xl text-xs uppercase tracking-widest hover:bg-orange-700 transition-all shadow-lg shadow-orange-600/25 mb-4"
              >
                Publish Post to Boards
              </button>
            </div>
          )}

          {/* Chat / Negotiation View Overlay */}
          {activeChat && (
            <div className="absolute inset-0 bg-[#FAF6F0] flex flex-col z-50 animate-in rounded-3xl">
              <div className="p-5 border-b border-zinc-200/60 flex justify-between items-center bg-white pt-6">
                <div className="flex items-center gap-3">
                  <button onClick={() => setActiveChat(null)} className="text-zinc-400 hover:text-zinc-700 p-1"><X className="w-5 h-5" /></button>
                  <div>
                    <p className="text-xs font-bold text-zinc-900">{activeChat.user}</p>
                    <p className="text-[9px] text-green-600 font-black uppercase tracking-wider">Offers Q: {activeChat.currentQ} ({activeChat.currentTime})</p>
                  </div>
                </div>
                <div className="bg-orange-50 text-orange-600 px-2.5 py-1 rounded-lg text-[9px] font-black border border-orange-200/80">ACTIVE</div>
              </div>
              
              <div className="flex-1 overflow-y-auto p-5 space-y-4">
                <div className="bg-amber-50/50 p-3.5 rounded-2xl border border-amber-200/50 flex items-start gap-2.5 shadow-sm">
                  <Info className="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5" />
                  <p className="text-[10px] text-amber-800 leading-relaxed font-semibold">
                    ระบบจะสลับคิว A{myQueue} (~{myCurrentTime}) ของคุณ กับคิว {activeChat.currentQ} (~{activeChat.currentTime}) ของคู่สนทนาทันทีหากกด Confirm
                  </p>
                </div>

                {chatMessages.map((msg, i) => (
                  <div key={i} className={`flex ${msg.sender === 'me' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[80%] p-3.5 rounded-2xl text-xs shadow-sm ${
                      msg.sender === 'me' ? 'bg-orange-600 text-white font-semibold' : 'bg-white text-zinc-800 border border-zinc-100'
                    }`}>
                      {msg.text}
                    </div>
                  </div>
                ))}
              </div>

              <div className="p-4 bg-white border-t border-zinc-200/60 pb-8">
                <form onSubmit={handleSendMessage} className="flex gap-2 mb-3">
                  <input 
                    type="text" 
                    value={newMsg}
                    onChange={(e) => setNewMsg(e.target.value)}
                    placeholder="พิมพ์ข้อความคุยสลับโต๊ะ..."
                    className="flex-1 bg-zinc-50 border border-zinc-200 rounded-xl px-4 py-2.5 text-xs text-zinc-800 focus:outline-none focus:border-orange-500"
                  />
                  <button type="submit" className="bg-orange-600 p-2.5 rounded-xl text-white hover:bg-orange-700 shadow-sm">
                    <Send className="w-4 h-4" />
                  </button>
                </form>
                
                <button 
                  onClick={() => performSwap(activeChat.currentQ)}
                  className="w-full bg-zinc-950 text-white font-black py-3.5 rounded-xl text-xs uppercase tracking-widest flex items-center justify-center gap-2 hover:bg-zinc-800 shadow-md active:scale-95 transition-all"
                >
                  <ArrowLeftRight className="w-4 h-4" /> Confirm Swap My Queue
                </button>
              </div>
            </div>
          )}
        </div>
      );

      const renderMerchantView = () => (
        <div className="bg-white min-h-[75vh] rounded-[2.5rem] shadow-2xl border border-zinc-200/80 overflow-hidden flex flex-col md:flex-row mb-10 animate-in">
          {/* Merchant Sidebar */}
          <div className="w-full md:w-72 bg-zinc-50/50 border-b md:border-b-0 md:border-r border-zinc-200 p-6 flex flex-col justify-between">
            <div>
              <div className="mb-8">
                <h2 className="text-xl font-black text-zinc-900 tracking-tight flex items-center gap-2">
                  <Store className="w-6 h-6 text-orange-600" />
                  Q.U.I.C.K. Hub
                </h2>
                <p className="text-[11px] text-zinc-500 font-bold uppercase tracking-wider mt-1">Merchant Portal</p>
              </div>

              <div className="space-y-6">
                <div>
                  <p className="text-[10px] text-zinc-400 font-bold uppercase tracking-wider mb-2">สาขาร้านค้า</p>
                  <p className="text-sm font-extrabold text-zinc-800">เจ๊ไก่ ส้มตำพรีเมียม (อารีย์)</p>
                  <p className="text-xs text-zinc-500 mt-1">สเตตัสร้าน: 
                    <span className="ml-1 px-2 py-0.5 rounded-md text-[10px] font-black bg-red-100 text-red-600 uppercase">
                      {storeStatus === 'full' ? 'แน่นมาก / คิวเต็ม' : 'ปกติ'}
                    </span>
                  </p>
                </div>

                <div className="border-t border-zinc-200 pt-4 space-y-3">
                  <div className="flex justify-between items-center text-xs">
                    <span className="text-zinc-500 font-semibold">โอกาสที่ช่วยหน้าร้าน (คิวหลุด):</span>
                    <span className="font-bold text-green-600 flex items-center gap-1">
                      <TrendingUp className="w-3.5 h-3.5" /> {savedOpportunities} ครั้ง
                    </span>
                  </div>
                  <div className="flex justify-between items-center text-xs">
                    <span className="text-zinc-500 font-semibold">จำนวนคนในระบบ Swap:</span>
                    <span className="font-bold text-orange-600">{swapRequests.length} คน</span>
                  </div>
                </div>
              </div>
            </div>

            <div className="mt-8 border-t border-zinc-200 pt-6">
              <button 
                onClick={triggerFlashSlot}
                className="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white font-extrabold py-3.5 rounded-2xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-orange-500/20 active:scale-95 transition-all"
              >
                <Zap className="w-4 h-4 animate-bounce" /> ปล่อย Flash Slot คิวหลุด!
              </button>
              <p className="text-[9px] text-zinc-400 text-center mt-2 font-medium">กดเพื่อสุ่มปล่อยที่นั่งว่างให้ลูกค้ากดดึงสิทธิ์แบบด่วนพิเศษ</p>
            </div>
          </div>

          {/* Merchant Management Panel */}
          <div className="flex-1 p-6 md:p-8 flex flex-col">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
              <div>
                <h3 className="text-2xl font-black text-zinc-950">คอนโซลหน้าร้าน</h3>
                <p className="text-xs text-zinc-500">จัดการความหนาแน่นและสลับคิวอัตโนมัติแบบเรียลไทม์</p>
              </div>
              <div className="flex gap-2 w-full sm:w-auto">
                <button 
                  onClick={handleAddManualQueue}
                  className="flex-1 sm:flex-initial bg-white border border-zinc-200 text-zinc-850 text-xs font-bold px-4 py-2.5 rounded-xl hover:bg-zinc-50 transition-colors flex items-center justify-center gap-1.5"
                >
                  <PlusCircle className="w-4 h-4 text-zinc-500" /> Walk-In คิวใหม่
                </button>
                <button 
                  onClick={handleCallNextQueue}
                  className="flex-1 sm:flex-initial bg-zinc-950 hover:bg-zinc-900 text-white text-xs font-black px-5 py-2.5 rounded-xl transition-all shadow-md flex items-center justify-center gap-1.5"
                >
                  <ArrowRight className="w-4 h-4" /> เรียกคิวถัดไป
                </button>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
              <div className="bg-orange-50 border border-orange-100 rounded-2xl p-5">
                <p className="text-[10px] text-orange-600 font-extrabold uppercase tracking-wider mb-1">คิวปัจจุบันที่เรียกทาน</p>
                <p className="text-4xl font-black text-orange-700">A{currentQueue}</p>
                <p className="text-[11px] text-orange-600/80 font-medium mt-1">กำลังเรียกตรวจเอกสาร/หน้าร้าน</p>
              </div>

              <div className="bg-zinc-50 border border-zinc-100 rounded-2xl p-5">
                <p className="text-[10px] text-zinc-500 font-extrabold uppercase tracking-wider mb-1">รอคิวอยู่ขณะนี้</p>
                <p className="text-4xl font-black text-zinc-900">{waitingList} คิว</p>
                <p className="text-[11px] text-zinc-500 font-medium mt-1">เฉลี่ยต่อคิวรอประมาณ 3-5 นาที</p>
              </div>

              <div className="bg-green-50 border border-green-100 rounded-2xl p-5">
                <p className="text-[10px] text-green-700 font-extrabold uppercase tracking-wider mb-1">สิทธิ์จองพิเศษที่กู้คืนมาได้</p>
                <p className="text-4xl font-black text-green-800">{savedOpportunities}</p>
                <p className="text-[11px] text-green-700/80 font-medium mt-1">จากการสลับแลกและ Flash-fill</p>
              </div>
            </div>

            <div className="flex-1">
              <h4 className="text-sm font-black text-zinc-900 mb-4 flex items-center gap-2">
                <Users className="w-4 h-4 text-orange-600" /> บอร์ดคำขอแลกเปลี่ยนเวลาคิวหลักในระบบ (Real-time Swap Pool)
              </h4>
              
              <div className="border border-zinc-200/80 rounded-2xl overflow-hidden shadow-sm">
                <div className="bg-zinc-50 p-3.5 border-b border-zinc-200 text-[11px] font-black uppercase tracking-wider text-zinc-500 grid grid-cols-4">
                  <div>ผู้ขอสลับ</div>
                  <div>คิว / เวลาปัจจุบัน</div>
                  <div>ช่วงเวลาที่ต้องการ</div>
                  <div className="text-right">จัดการคิว</div>
                </div>

                <div className="divide-y divide-zinc-100 max-h-[300px] overflow-y-auto custom-scrollbar">
                  {swapRequests.map((req) => (
                    <div key={req.id} className="p-4 grid grid-cols-4 items-center text-xs hover:bg-zinc-50/50 transition-colors">
                      <div className="flex items-center gap-2">
                        <div className="w-7 h-7 bg-zinc-100 rounded-full flex items-center justify-center font-bold text-zinc-600">
                          {req.user.replace('K. ', '').charAt(0)}
                        </div>
                        <div>
                          <p className="font-extrabold text-zinc-800">{req.user}</p>
                          <p className="text-[9px] text-zinc-400">ห่าง {req.distance}</p>
                        </div>
                      </div>
                      <div>
                        <span className="font-extrabold text-orange-600 bg-orange-50 px-2 py-0.5 rounded border border-orange-100">{req.currentQ}</span>
                        <span className="text-zinc-500 ml-2 font-medium">({req.currentTime})</span>
                      </div>
                      <div className="font-bold text-zinc-700">{req.desiredTime}</div>
                      <div className="text-right flex justify-end gap-1.5">
                        <button 
                          onClick={() => {
                            setChatMessages([{ sender: 'other', text: `ร้านค้าต้องการช่วยเหลือในการสลับคิวของคุณ ${req.user} รบกวนยืนยันความสะดวกด้วยครับ` }]);
                            setActiveChat(req);
                            setActiveView('customer');
                          }}
                          className="px-2.5 py-1.5 bg-zinc-100 hover:bg-zinc-200 text-zinc-800 font-bold rounded-lg text-[10px] transition-colors"
                        >
                          คุยช่วยเหลือ
                        </button>
                        <button 
                          onClick={() => performSwap(req.currentQ)}
                          className="px-2.5 py-1.5 bg-orange-600 hover:bg-orange-700 text-white font-extrabold rounded-lg text-[10px] transition-colors"
                        >
                          อนุมัติสลับ
                        </button>
                      </div>
                    </div>
                  ))}
                  {swapRequests.length === 0 && (
                    <div className="p-10 text-center text-zinc-400 font-medium">
                      ไม่มีข้อเสนอแลกคิวบนบอร์ดในขณะนี้
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );

      return (
        <div className="w-full relative py-4">
          {/* Toast Notification Container */}
          {toast && (
            <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-zinc-950 text-white text-xs font-bold py-3.5 px-6 rounded-2xl shadow-2xl flex items-center gap-3 border border-zinc-800 animate-in">
              <span className="w-2 h-2 bg-orange-500 rounded-full animate-ping"></span>
              {toast}
            </div>
          )}

          {/* Core Simulator Switcher Header */}
          <div className="flex justify-between items-center bg-white/80 backdrop-blur border border-zinc-200/80 px-4 py-3 rounded-2xl mb-6 shadow-sm">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 bg-orange-600 text-white rounded-lg flex items-center justify-center font-black text-sm">Q</div>
              <div>
                <p className="text-xs font-black text-zinc-900 tracking-tight">Q.U.I.C.K. Simulator</p>
                <p className="text-[9px] font-bold text-zinc-400">คิวหลุด เราเติม คิวเต็ม เราจัดการ</p>
              </div>
            </div>
            
            <div className="flex bg-zinc-100 p-1 rounded-xl border border-zinc-200">
              <button 
                onClick={() => { setActiveView('customer'); setActiveChat(null); }}
                className={`px-3.5 py-2 rounded-lg text-xs font-extrabold transition-all duration-200 flex items-center gap-1.5
                  ${activeView === 'customer' ? 'bg-white text-zinc-950 shadow-sm' : 'text-zinc-500 hover:text-zinc-800'}`}
              >
                <User className="w-3.5 h-3.5" /> จำลองฝั่งลูกค้า
              </button>
              <button 
                onClick={() => { setActiveView('merchant'); setActiveChat(null); }}
                className={`px-3.5 py-2 rounded-lg text-xs font-extrabold transition-all duration-200 flex items-center gap-1.5
                  ${activeView === 'merchant' ? 'bg-white text-zinc-950 shadow-sm' : 'text-zinc-500 hover:text-zinc-800'}`}
              >
                <Store className="w-3.5 h-3.5" /> ระบบร้านค้า (Hub)
              </button>
            </div>
          </div>

          {/* Render Active View Container */}
          {activeView === 'customer' ? renderCustomerView() : renderMerchantView()}

          {/* Quick Demo Assist Banner */}
          <div className="text-center mt-6">
            <p className="text-xs text-zinc-400 font-bold">
              💡 ทดสอบระบบ: คุณสามารถปรับแต่งหน้าจอคิว คุยสลับคิว บันทึกคิวหลุด และสลับเพื่อกดเรียกคิวที่หน้าจอร้านค้าได้ทันที
            </p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
